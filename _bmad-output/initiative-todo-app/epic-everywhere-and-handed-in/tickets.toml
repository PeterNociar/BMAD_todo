[[entry]]
id = 7
type = "story"
title = "User-journey E2E suite"
description = "Adds e2e/tests/journeys.spec.ts with at least five end-to-end journeys on the test profile, driven only through the UI and the 1.5 fixtures: UJ-1 (jot a task mid-meeting, it stays visible then settles), UJ-2 (clear the backlog: tick, untick an overdue task back to its place, delete, with rollback on failure, ending on the empty state), UJ-3 (a task goes overdue live), load-failure Retry, and cross-device sync."
verify = "npm test in e2e/ runs the journey suite green three times in a row on the rebuilt test stack, with at least five journey tests and no CSP or critical axe violations."
covers = ["CAP-9", "CAP-10"]
after = [6]
hitl = false
risk = "low"
