[project]
name = "todo-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.20.0",
    "fastapi~=0.142.0",
    "psycopg[binary]~=3.3.0",
    "pydantic~=2.13.0",
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel~=0.0.47",
    "uvicorn~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest~=9.1.0",
    "pytest-cov~=7.1.0",
    "ruff~=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app"]
